<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATI-鉴定你的阿尔卡那</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="info">
            <h1>ATI--阿尔卡那类型测评</h1>
            <p>by chail</p>
        </div>
        <ul>
            <li><button id="home">首页</button></li>
            <li><button id="catalog">图鉴</button></li>
        </ul>
    </header>
    <div class="container">
        <div id="title-container" class="title-container">
            <h1>Arcana Type Indicator</h1>
            <h1>阿尔卡那类型测评</h1>
            <p id="brief">简介内容</p>
            <button id="start">开始测评</button>
        </div>
        <div id="questions-container" class="questions-container">
            <div id="questions" class="questions hidden"></div>
            <button id="submit" class="submit hidden">查看结果</button>
        </div>
        <div id="result-container" class="result-container hidden">
        </div>
        <button id="again" class="again hidden">再测一次</button>
    </div>
    <footer>
        <a href="https://github.com/chail233/Arcana-Type-Indicator">⭐Github⭐</a>
    </footer>
    <script src="script.js"></script>
</body>
</html>
